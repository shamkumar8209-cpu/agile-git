<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor | HealthBlock</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black text-white">

<header class="px-10 py-6 border-b border-gray-800">
  <h1 class="text-2xl font-bold text-cyan-400">Doctor Dashboard</h1>
  <p class="text-sm text-gray-400">Authorized Patient Records</p>
</header>

<section class="px-10 py-16 max-w-5xl mx-auto">
  <div class="glass-card">
    <h2 class="text-xl font-semibold mb-6">Accessible Records</h2>

    <div class="space-y-4">
      <div class="record-card">
        <p class="text-sm text-gray-400">Patient ID: P102</p>
        <p class="text-xs break-all text-cyan-300">
          Hash: 0xA23F91BC89E7D...
        </p>
      </div>

      <div class="record-card">
        <p class="text-sm text-gray-400">Patient ID: P221</p>
        <p class="text-xs break-all text-cyan-300">
          Hash: 0xC91D7FA21BC0...
        </p>
      </div>
    </div>

    <p class="mt-6 text-xs text-gray-500">
      Records are visible only after patient grants blockchain permission.
    </p>
  </div>
</section>

<style>
  .glass-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 40px;
  }

  .record-card {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,255,255,0.2);
    border-radius: 12px;
    padding: 16px;
    transition: 0.3s;
  }

  .record-card:hover {
    box-shadow: 0 0 18px rgba(0,255,255,0.4);
    transform: scale(1.02);
  }
</style>

</body>
</html>
